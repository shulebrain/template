<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Website</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(120deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
    max-width:500px;
}

h1{
    color:#333;
    margin-bottom:10px;
}

p{
    color:#555;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#00c6ff;
    transform:scale(1.05);
}

.footer{
    margin-top:20px;
    font-size:13px;
    color:#888;
}

</style>

</head>

<body>

<div class="container">

<h1>🚀 My First Website</h1>

<p>This is a test website hosted online.</p>

<p>If you can see this page, your website is working perfectly.</p>

<button onclick="showMessage()">Click Me</button>

<div class="footer">
Made with HTML ❤️
</div>

</div>

<script>

function showMessage(){
    alert("Congratulations! Your website is working.");
}

</script>

</body>
</html>
